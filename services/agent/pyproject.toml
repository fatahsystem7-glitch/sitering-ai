[project]
name = "sitering-agent"
version = "0.1.0"
description = "sitering-ai LiveKit voice receptionist worker (OpenAI + Fish Audio)"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,deepgram,silero,turn-detector]~=1.0",
  "livekit-plugins-fishaudio",
  "livekit-api",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitering_agent"]
